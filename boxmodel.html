<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <link rel="stylesheet" href="./css/boxstyle.css">
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #box1 {
            width: 100px;
            height: 200px;
            background-color: rgb(219, 135, 131);
            border: solid 5px black;
        }

        #wrapper {
            width: 500px;
            height: 500px;
            background-color: rgb(158, 205, 246);
            border: solid 20px rgb(113, 32, 123);
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <div id="box1">
            Box 1
        </div>

        <div id="box2">
            Box 2
        </div>
    </div>
</body>

</html>
